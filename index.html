<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Potaya Smaç — Basketbol Oyunu</title>
<style>
  :root{
    --ink:#3a2415;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#2b1a10;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative;
    width:100vw; height:100vh;
    max-width:480px; max-height:800px;
    aspect-ratio:480/800;
    margin:auto;
    box-shadow:0 0 60px rgba(0,0,0,0.5);
  }
  canvas{
    display:block;
    width:100%; height:100%;
    touch-action:none;
    cursor:pointer;
  }
  #hud{
    position:absolute; top:14px; left:14px; right:14px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none;
  }
  .badge{
    background:rgba(90,52,32,0.92);
    border:2px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:6px 16px;
    text-align:center;
    color:#f6e8ce;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .badge .label{
    font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; opacity:0.75;
    font-weight:700;
  }
  .badge .val{
    font-size:1.3rem; font-weight:800; line-height:1.1;
  }
  #multBadge{
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    background:linear-gradient(160deg,#ffcf5c,#ff8a1f);
    color:#5a2e00;
    font-weight:800; font-size:1rem;
    padding:4px 14px; border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    transition:transform 0.15s ease;
    opacity:0;
  }
  #multBadge.show{ opacity:1; }
  #multBadge.bump{ transform:translateX(-50%) scale(1.3); }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(40,22,12,0.68);
    backdrop-filter:blur(2px);
    color:#fbeedb;
    padding:24px;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-size:1.9rem; margin:0 0 6px;
  }
  #overlay p{
    margin:4px 0 18px;
    opacity:0.9;
    font-size:0.95rem;
    max-width:300px;
    line-height:1.55;
  }
  #overlay .score-row{
    display:flex; gap:28px; margin-bottom:22px;
  }
  #overlay .score-box{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:10px 20px;
  }
  #overlay .score-box .label{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; opacity:0.75;
  }
  #overlay .score-box .val{
    font-size:1.6rem; font-weight:800;
  }
  #startBtn{
    background:linear-gradient(160deg,#ff5f96,#d81159);
    border:none; color:#fff; font-weight:800; font-size:1.05rem;
    padding:14px 34px; border-radius:999px;
    box-shadow:0 8px 20px rgba(216,17,89,0.45);
    cursor:pointer;
  }
  #startBtn:active{ transform:scale(0.97); }
  #footer-hint{
    position:absolute; bottom:10px; left:0; right:0;
    text-align:center; font-size:0.72rem; color:rgba(251,238,219,0.55);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="badge">
      <div class="label">Skor</div>
      <div class="val" id="scoreEl">0</div>
    </div>
    <div class="badge">
      <div class="label">Rekor</div>
      <div class="val" id="bestEl">0</div>
    </div>
  </div>
  <div id="multBadge">x1</div>
  <div id="overlay">
    <h1>🏀 Potaya Smaç</h1>
    <p>Topu geri çekip bırak: tuttuğun yönün tersine fırlar ve bir yay çizerek
    bir sonraki çembere uçar. Çembere değmeden tam ortadan geçersen çarpanın
    artar. Bir çemberi kaçırırsan oyun biter.</p>
    <div class="score-row">
      <div class="score-box">
        <div class="label">Skor</div>
        <div class="val" id="lastScore">0</div>
      </div>
      <div class="score-box">
        <div class="label">Rekor</div>
        <div class="val" id="bestScore">0</div>
      </div>
    </div>
    <button id="startBtn">Başla</button>
  </div>
  <div id="footer-hint">Yıldırım • Potaya Smaç</div>
</div>

<script>
(function(){
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var scoreEl = document.getElementById('scoreEl');
  var bestEl = document.getElementById('bestEl');
  var multBadge = document.getElementById('multBadge');
  var startBtn = document.getElementById('startBtn');
  var lastScoreEl = document.getElementById('lastScore');
  var bestScoreEl = document.getElementById('bestScore');

  var W = 480, H = 800;
  canvas.width = W;
  canvas.height = H;

  var BEST_KEY = 'potayasmac_best';
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch(e){ best = 0; }
  bestEl.textContent = best;
  bestScoreEl.textContent = best;

  var gameState = 'start'; // start | playing | over
  var ballState = 'ready'; // ready | aiming | flying | falling
  var score = 0;
  var multiplier = 1;

  var GRAVITY = 1700;
  var MAX_DRAG = 150;
  var POWER_SCALE = 6.5;
  var MIN_DRAG = 14;

  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 18, rot: 0 };
  var camera = { y: 0 };

  var RING_R = 52;
  var RIM_THICK = 13;
  var RING_OUTER = RING_R + RIM_THICK;
  var ring = { x: 0, y: 0, resolved: false };
  var prevRingGhost = null; // for brief fade-out visual

  var clouds = [];
  var highestSpawnY = 0; // most negative world y reached by spawned decor

  var drag = { active:false, sx:0, sy:0, cx:0, cy:0, vx:0, vy:0 };
  var fallTimer = 0;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function resetWorld(){
    score = 0;
    multiplier = 1;
    scoreEl.textContent = '0';
    multBadge.textContent = 'x1';
    multBadge.classList.remove('show','bump');

    ball.x = W * 0.5;
    ball.y = 0;
    ball.vx = 0; ball.vy = 0; ball.rot = 0;
    camera.y = ball.y - H * 0.72;
    ballState = 'ready';

    ring.x = W * 0.5 + (Math.random()*160-80);
    ring.x = clamp(ring.x, 70, W-70);
    ring.y = ball.y - (220 + Math.random()*70);
    ring.resolved = false;
    prevRingGhost = null;

    clouds = [];
    highestSpawnY = ball.y + 40;
    for(var i=0;i<5;i++) spawnCloud();
  }

  function spawnCloud(){
    highestSpawnY -= (120 + Math.random()*90);
    clouds.push({
      x: 40 + Math.random()*(W-80),
      y: highestSpawnY,
      scale: 0.6 + Math.random()*0.8,
      speed: 0.35 + Math.random()*0.25
    });
  }

  function spawnNextRing(){
    prevRingGhost = { x: ring.x, y: ring.y, alpha: 1 };
    var dx = (Math.random()*230 - 115);
    var nx = clamp(ring.x + dx, 70, W-70);
    var ny = ring.y - (190 + Math.random()*90);
    ring.x = nx; ring.y = ny; ring.resolved = false;
    while(highestSpawnY > ny - 300){ spawnCloud(); }
  }

  function startGame(){
    resetWorld();
    gameState = 'playing';
    overlay.classList.add('hidden');
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function bumpMultiplier(){
    multBadge.classList.add('show');
    multBadge.classList.remove('bump');
    void multBadge.offsetWidth;
    multBadge.classList.add('bump');
  }

  function endGame(){
    gameState = 'over';
    lastScoreEl.textContent = score;
    if(score > best){
      best = score;
      bestEl.textContent = best;
      bestScoreEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){}
    }
    document.querySelector('#overlay h1').textContent = '🏀 Oyun Bitti';
    document.querySelector('#overlay p').textContent = 'Çemberi kaçırdın! Tekrar dene ve çarpanını büyüt.';
    startBtn.textContent = 'Tekrar Oyna';
    overlay.classList.remove('hidden');
  }

  function screenPos(worldX, worldY){
    return { x: worldX, y: worldY - camera.y };
  }

  function shoot(vx, vy){
    ball.vx = vx; ball.vy = vy;
    ballState = 'flying';
  }

  function resolveRing(dist){
    if(dist <= RING_R - ball.r){
      score += multiplier;
      multiplier += 1;
      scoreEl.textContent = score;
      multBadge.textContent = 'x' + multiplier;
      bumpMultiplier();
    } else {
      score += 1;
      multiplier = 1;
      scoreEl.textContent = score;
      multBadge.textContent = 'x1';
      multBadge.classList.remove('show');
    }
    ball.x = ring.x; ball.y = ring.y;
    ball.vx = 0; ball.vy = 0; ball.rot = 0;
    ballState = 'ready';
    spawnNextRing();
  }

  function update(dt){
    for(var i=0;i<clouds.length;i++) clouds[i].x += clouds[i].speed * dt * 6;
    while(clouds.length && clouds[0].y > ball.y + H*1.3){ clouds.shift(); }

    var targetCamY = ball.y - H * 0.72;
    camera.y += (targetCamY - camera.y) * Math.min(1, dt*4.2);

    if(ballState === 'flying'){
      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.rot += ball.vx * dt * 0.01;

      if(ball.x - ball.r < 10){ ball.x = ball.r + 10; ball.vx *= -0.55; }
      if(ball.x + ball.r > W-10){ ball.x = W-10-ball.r; ball.vx *= -0.55; }

      if(!ring.resolved && ball.y <= ring.y){
        ring.resolved = true;
        var dx = ring.x - ball.x;
        var dy = ring.y - ball.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < RING_OUTER + ball.r){
          resolveRing(dist);
        } else {
          ballState = 'falling';
          fallTimer = 0;
        }
      }
    }

    if(ballState === 'falling'){
      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.rot += ball.vx * dt * 0.01;
      fallTimer += dt;
      if(fallTimer > 1.1 || ball.y - camera.y > H + 140){
        endGame();
      }
    }
  }

  // Track apex-missed condition separately (cleaner than inline above)
  var launchY = 0;
  var pastApex = false;
  var origShoot = shoot;
  shoot = function(vx, vy){
    origShoot(vx, vy);
    launchY = ball.y;
    pastApex = false;
  };

  function checkApexMiss(){
    if(ballState !== 'flying' || ring.resolved) return;
    if(ball.vy >= 0){
      if(!pastApex) pastApex = true;
      if(ball.y >= launchY){
        ring.resolved = true;
        ballState = 'falling';
        fallTimer = 0;
      }
    }
  }

  function drawBackground(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#f3e6c6');
    g.addColorStop(1, '#e7cf9e');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for(var i=0;i<clouds.length;i++){
      var c = clouds[i];
      var sp = screenPos(c.x, c.y);
      if(sp.y < -80 || sp.y > H+80) continue;
      drawCloud(sp.x, sp.y, c.scale);
    }
  }

  function drawCloud(cx, cy, scale){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(255,250,235,0.65)';
    ctx.beginPath();
    ctx.arc(0,0,26,0,Math.PI*2);
    ctx.arc(26,8,20,0,Math.PI*2);
    ctx.arc(-26,8,20,0,Math.PI*2);
    ctx.arc(0,16,24,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawMountains(){
    var baseSp = screenPos(0, 40);
    if(baseSp.y < -260 || baseSp.y > H+100) return;
    ctx.fillStyle = '#cbb688';
    ctx.beginPath();
    ctx.moveTo(-20, baseSp.y);
    ctx.lineTo(90, baseSp.y-160);
    ctx.lineTo(190, baseSp.y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d9c79b';
    ctx.beginPath();
    ctx.moveTo(150, baseSp.y);
    ctx.lineTo(300, baseSp.y-220);
    ctx.lineTo(430, baseSp.y);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround(){
    var sp = screenPos(0, 40);
    if(sp.y > H) {
      ctx.fillStyle = '#8b5e3c';
      ctx.fillRect(0, sp.y, W, Math.max(H, 40));
      ctx.fillStyle = '#6b4226';
      ctx.fillRect(0, sp.y, W, 8);
    } else if(sp.y + 400 > 0){
      ctx.fillStyle = '#8b5e3c';
      ctx.fillRect(0, sp.y, W, 400);
      ctx.fillStyle = '#6b4226';
      ctx.fillRect(0, sp.y, W, 8);
    }
  }

  function drawRingAt(sx, sy, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.save();
    ctx.globalAlpha = alpha * 0.35;
    ctx.shadowColor = '#ff7a1f';
    ctx.shadowBlur = 24;
    ctx.strokeStyle = '#ff5a1f';
    ctx.lineWidth = RIM_THICK + 6;
    ctx.beginPath();
    ctx.arc(sx, sy, RING_R + RIM_THICK/2, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();

    var grad = ctx.createLinearGradient(sx, sy-RING_OUTER, sx, sy+RING_OUTER);
    grad.addColorStop(0, '#ffcf5c');
    grad.addColorStop(0.5, '#ff7a1f');
    grad.addColorStop(1, '#e8360f');
    ctx.strokeStyle = grad;
    ctx.lineWidth = RIM_THICK;
    ctx.beginPath();
    ctx.arc(sx, sy, RING_R + RIM_THICK/2, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, RING_R + 2, -Math.PI*0.85, -Math.PI*0.15);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(70,20,0,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, RING_R, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }

  function drawRings(){
    if(prevRingGhost && prevRingGhost.alpha > 0){
      var psp = screenPos(prevRingGhost.x, prevRingGhost.y);
      drawRingAt(psp.x, psp.y, prevRingGhost.alpha);
      prevRingGhost.alpha -= 0.06;
      if(prevRingGhost.alpha <= 0) prevRingGhost = null;
    }
    var sp = screenPos(ring.x, ring.y);
    if(sp.y > -120 && sp.y < H+120){
      drawRingAt(sp.x, sp.y, 1);
    }
  }

  function drawTrajectoryPreview(){
    if(ballState !== 'ready' || !drag.active) return;
    var vx = drag.vx, vy = drag.vy;
    var px = ball.x, py = ball.y, pvx = vx, pvy = vy;
    var t = 0, dt = 0.045;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for(var i=0;i<22;i++){
      pvy += GRAVITY*dt;
      px += pvx*dt;
      py += pvy*dt;
      var sp = screenPos(px, py);
      var rr = Math.max(1.5, 4.5 - i*0.15);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, rr, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawSlingshot(){
    if(ballState !== 'ready' || !drag.active) return;
    var bsp = screenPos(ball.x, ball.y);
    ctx.strokeStyle = 'rgba(216,17,89,0.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(bsp.x, bsp.y);
    ctx.lineTo(bsp.x + (drag.cx-drag.sx), bsp.y + (drag.cy-drag.sy));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBall(){
    var sp = screenPos(ball.x, ball.y);
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(ball.rot);
    var r = ball.r;

    var g = ctx.createRadialGradient(-r*0.35,-r*0.35,r*0.2,0,0,r);
    g.addColorStop(0, '#ff8fb8');
    g.addColorStop(1, '#e0145f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = '#6e0a30';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r,-Math.PI*0.75,-Math.PI*0.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r,Math.PI*0.25,Math.PI*0.75); ctx.stroke();

    ctx.restore();
  }

  function render(){
    drawBackground();
    drawMountains();
    drawRings();
    drawGround();
    drawTrajectoryPreview();
    drawSlingshot();
    drawBall();
  }

  var lastTime = null;
  function loop(ts){
    if(gameState !== 'playing'){ render(); return; }
    if(lastTime == null) lastTime = ts;
    var dt = Math.min((ts-lastTime)/1000, 1/30);
    lastTime = ts;
    update(dt);
    checkApexMiss();
    render();
    requestAnimationFrame(loop);
  }

  function canvasPoint(clientX, clientY){
    var rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W/rect.width),
      y: (clientY - rect.top) * (H/rect.height)
    };
  }

  function updateDrag(cx, cy){
    drag.cx = cx; drag.cy = cy;
    var bsp = screenPos(ball.x, ball.y);
    var dx = cx - bsp.x, dy = cy - bsp.y;
    var len = Math.sqrt(dx*dx+dy*dy);
    if(len > MAX_DRAG){ dx = dx/len*MAX_DRAG; dy = dy/len*MAX_DRAG; }
    drag.vx = -dx * POWER_SCALE;
    drag.vy = -dy * POWER_SCALE;
    drag._len = Math.min(len, MAX_DRAG);
  }

  function onDown(clientX, clientY){
    if(gameState !== 'playing' || ballState !== 'ready') return;
    var p = canvasPoint(clientX, clientY);
    drag.active = true;
    drag.sx = p.x; drag.sy = p.y;
    updateDrag(p.x, p.y);
  }
  function onMove(clientX, clientY){
    if(!drag.active) return;
    var p = canvasPoint(clientX, clientY);
    updateDrag(p.x, p.y);
  }
  function onUp(){
    if(!drag.active) return;
    drag.active = false;
    if(drag._len >= MIN_DRAG){
      shoot(drag.vx, drag.vy);
    }
  }

  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function(e){ e.preventDefault(); onMove(e.clientX, e.clientY); });
  window.addEventListener('pointerup', function(e){ onUp(); });

  startBtn.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    e.preventDefault();
    startGame();
  });

  resetWorld();
  render();

  // debug hook for automated testing
  window.__dbg = function(){
    return {
      gameState: gameState, ballState: ballState,
      ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy },
      ring: { x: ring.x, y: ring.y, resolved: ring.resolved },
      camY: camera.y, score: score, multiplier: multiplier, best: best
    };
  };
  window.__debugShoot = function(vx, vy){
    if(ballState === 'ready') shoot(vx, vy);
  };
  window.__debugStart = function(){ startGame(); };
})();
</script>
</body>
</html>
