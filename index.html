<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Potaya Smaç — Basketbol Oyunu</title>
<style>
  :root{
    --ink:#3a2415;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#1c2a3a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative;
    width:100vw; height:100vh;
    max-width:480px; max-height:800px;
    aspect-ratio:480/800;
    margin:auto;
    box-shadow:0 0 60px rgba(0,0,0,0.5);
  }
  canvas{
    display:block;
    width:100%; height:100%;
    touch-action:none;
    cursor:pointer;
  }
  #hud{
    position:absolute; top:14px; left:14px; right:14px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none;
  }
  .badge{
    background:rgba(60,38,20,0.85);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:6px 16px;
    text-align:center;
    color:#fff0da;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .badge .label{
    font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; opacity:0.75;
    font-weight:700;
  }
  .badge .val{
    font-size:1.3rem; font-weight:800; line-height:1.1;
  }
  #multBadge{
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    background:linear-gradient(160deg,#ffcf5c,#ff8a1f);
    color:#5a2e00;
    font-weight:800; font-size:1rem;
    padding:4px 14px; border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    transition:transform 0.15s ease;
    opacity:0;
  }
  #multBadge.show{ opacity:1; }
  #multBadge.bump{ transform:translateX(-50%) scale(1.3); }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(10,24,40,0.68);
    backdrop-filter:blur(2px);
    color:#fff6e6;
    padding:24px;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-size:1.9rem; margin:0 0 6px;
  }
  #overlay p{
    margin:4px 0 18px;
    opacity:0.9;
    font-size:0.95rem;
    max-width:300px;
    line-height:1.55;
  }
  #overlay .score-row{
    display:flex; gap:28px; margin-bottom:22px;
  }
  #overlay .score-box{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:10px 20px;
  }
  #overlay .score-box .label{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; opacity:0.75;
  }
  #overlay .score-box .val{
    font-size:1.6rem; font-weight:800;
  }
  #startBtn{
    background:linear-gradient(160deg,#4fd48c,#1f9e6a);
    border:none; color:#fff; font-weight:800; font-size:1.05rem;
    padding:14px 34px; border-radius:999px;
    box-shadow:0 8px 20px rgba(31,158,106,0.45);
    cursor:pointer;
  }
  #startBtn:active{ transform:scale(0.97); }
  #splashText{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    text-align:center;
    color:#fff6e6;
    text-shadow:0 4px 14px rgba(0,0,0,0.4);
    pointer-events:none;
    opacity:0;
  }
  #splashText .big{ font-size:2.1rem; font-weight:800; }
  #splashText .mult{ font-size:1.6rem; font-weight:800; color:#ffd36b; }
  #footer-hint{
    position:absolute; bottom:10px; left:0; right:0;
    text-align:center; font-size:0.72rem; color:rgba(255,246,230,0.55);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="badge">
      <div class="label">Skor</div>
      <div class="val" id="scoreEl">0</div>
    </div>
    <div class="badge">
      <div class="label">Rekor</div>
      <div class="val" id="bestEl">0</div>
    </div>
  </div>
  <div id="multBadge">x1</div>
  <div id="splashText">
    <div class="big">SPLASH</div>
    <div class="mult" id="splashMult">x1</div>
  </div>
  <div id="overlay">
    <h1>🏀 Potaya Smaç</h1>
    <p>Dokun dokun zıpla: top yerçekimiyle sürekli düşer, her dokunuşunda
    yukarı sıçrar. Önünden gelen çemberlerin ortasından, değmeden geçersen
    çarpanın artar. Çemberi ıskalarsan ya da suya düşersen oyun biter.</p>
    <div class="score-row">
      <div class="score-box">
        <div class="label">Skor</div>
        <div class="val" id="lastScore">0</div>
      </div>
      <div class="score-box">
        <div class="label">Rekor</div>
        <div class="val" id="bestScore">0</div>
      </div>
    </div>
    <button id="startBtn">Başla</button>
  </div>
  <div id="footer-hint">Yıldırım • Potaya Smaç</div>
</div>

<script>
(function(){
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var scoreEl = document.getElementById('scoreEl');
  var bestEl = document.getElementById('bestEl');
  var multBadge = document.getElementById('multBadge');
  var startBtn = document.getElementById('startBtn');
  var lastScoreEl = document.getElementById('lastScore');
  var bestScoreEl = document.getElementById('bestScore');
  var splashText = document.getElementById('splashText');
  var splashMultEl = document.getElementById('splashMult');

  var W = 480, H = 800;
  canvas.width = W;
  canvas.height = H;

  var BEST_KEY = 'potayasmac_best';
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch(e){ best = 0; }
  bestEl.textContent = best;
  bestScoreEl.textContent = best;

  var gameState = 'start'; // start | playing | splashing | over
  var score = 0;
  var multiplier = 1;

  var GRAVITY = 1550;
  var FLAP_VY = -430;
  var FORWARD_SPEED = 150;
  var WATER_LEVEL = H - 90;

  var ball = { x: 0, y: 0, vy: 0, r: 19, rot: 0 };
  var camera = { x: 0 };

  // ring is drawn as a flattened (horizontal) ellipse, like a hoop seen
  // front-on but lying toward the camera -- RING_RX is the visual half-width,
  // RING_R is the vertical half-height and is what gameplay/collision uses.
  var RING_RX = 76;
  var RING_R = 34;
  var RIM_THICK = 12;
  var RING_OUTER = RING_R + RIM_THICK;
  var ring = { x: 0, y: 0, resolved: false, passed: false };
  var prevRingGhost = null;

  var waves = [];
  var dunes = [];
  var clouds = [];
  var furthestSpawnX = 0;

  var splashTimer = 0;
  var fallVy = 0;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }

  function resetWorld(){
    score = 0;
    multiplier = 1;
    scoreEl.textContent = '0';
    multBadge.textContent = 'x1';
    multBadge.classList.remove('show','bump');
    splashText.style.opacity = 0;

    ball.x = 0;
    ball.y = H * 0.45;
    ball.vy = 0;
    ball.rot = 0;
    camera.x = ball.x - W * 0.3;

    ring.x = ball.x + 360;
    ring.y = rand(H*0.28, H*0.62);
    ring.resolved = false;
    ring.passed = false;
    prevRingGhost = null;

    waves = [];
    dunes = [];
    clouds = [];
    furthestSpawnX = ball.x - 100;
    for(var i=0;i<10;i++) spawnDecor();
  }

  function spawnDecor(){
    furthestSpawnX += rand(70,120);
    clouds.push({ x: furthestSpawnX + rand(0,200), y: rand(60,220), scale: rand(0.6,1.2), speed: rand(0.2,0.4) });
    if(Math.random() < 0.5){
      dunes.push({ x: furthestSpawnX, h: rand(70,150) });
    }
  }

  function spawnNextRing(){
    prevRingGhost = { x: ring.x, y: ring.y, alpha: 1 };
    var nx = ring.x + rand(300, 420);
    var ny = clamp(ring.y + rand(-140,140), H*0.2, H*0.68);
    ring.x = nx; ring.y = ny; ring.resolved = false; ring.passed = false;
    while(furthestSpawnX < nx + 300){ spawnDecor(); }
  }

  function startGame(){
    resetWorld();
    gameState = 'playing';
    overlay.classList.add('hidden');
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function bumpMultiplier(){
    multBadge.classList.add('show');
    multBadge.classList.remove('bump');
    void multBadge.offsetWidth;
    multBadge.classList.add('bump');
  }

  function flap(){
    if(gameState !== 'playing') return;
    ball.vy = FLAP_VY;
  }

  function doSplash(finalMult){
    gameState = 'splashing';
    splashTimer = 0;
    fallVy = ball.vy;
    splashMultEl.textContent = 'x' + finalMult;
    splashText.style.opacity = 1;
  }

  function endGame(){
    gameState = 'over';
    lastScoreEl.textContent = score;
    if(score > best){
      best = score;
      bestEl.textContent = best;
      bestScoreEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){}
    }
    document.querySelector('#overlay h1').textContent = '🌊 Suya Düştün!';
    document.querySelector('#overlay p').textContent = 'Çemberi kaçırdın. Tekrar dene ve çarpanını büyüt.';
    startBtn.textContent = 'Tekrar Oyna';
    overlay.classList.remove('hidden');
  }

  function screenPos(worldX, worldY){
    return { x: worldX - camera.x, y: worldY };
  }

  function resolveRing(dy){
    if(dy <= RING_R - ball.r){
      score += multiplier;
      multiplier += 1;
      scoreEl.textContent = score;
      multBadge.textContent = 'x' + multiplier;
      bumpMultiplier();
    } else {
      score += 1;
      multiplier = 1;
      scoreEl.textContent = score;
      multBadge.textContent = 'x1';
      multBadge.classList.remove('show');
    }
    ring.passed = true;
    spawnNextRing();
  }

  function update(dt){
    ball.x += FORWARD_SPEED * dt;
    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    ball.rot += dt * 5.5;

    var targetCamX = ball.x - W * 0.3;
    camera.x += (targetCamX - camera.x) * Math.min(1, dt*6);

    for(var i=0;i<clouds.length;i++) clouds[i].x += 0;
    while(clouds.length && clouds[0].x < camera.x - 150) clouds.shift();
    while(dunes.length && dunes[0].x < camera.x - 150) dunes.shift();

    if(gameState === 'playing'){
      if(!ring.resolved && ball.x >= ring.x - ball.r){
        ring.resolved = true;
        var dy = Math.abs(ball.y - ring.y);
        if(dy < RING_OUTER + ball.r){
          resolveRing(dy);
        } else {
          doSplash(multiplier);
        }
      }
      if(ball.y - ball.r > WATER_LEVEL){
        doSplash(multiplier);
      }
      if(ball.y < -40){ ball.y = -40; ball.vy = 0; }
    }

    if(gameState === 'splashing'){
      fallVy += GRAVITY * dt;
      ball.vy = fallVy;
      ball.y += fallVy * dt;
      ball.rot += dt * 9;
      splashTimer += dt;
      if(splashTimer > 0.9){
        endGame();
      }
    }
  }

  function drawSky(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#2b3f63');
    g.addColorStop(0.35, '#e8795f');
    g.addColorStop(0.62, '#f5b98a');
    g.addColorStop(1, '#f7dca8');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawClouds(){
    for(var i=0;i<clouds.length;i++){
      var c = clouds[i];
      var sp = screenPos(c.x, c.y);
      if(sp.x < -80 || sp.x > W+80) continue;
      drawCloud(sp.x, sp.y, c.scale);
    }
  }

  function drawCloud(cx, cy, scale){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(255,250,240,0.75)';
    ctx.beginPath();
    ctx.arc(0,0,24,0,Math.PI*2);
    ctx.arc(24,7,18,0,Math.PI*2);
    ctx.arc(-24,7,18,0,Math.PI*2);
    ctx.arc(0,14,22,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawDunes(){
    for(var i=0;i<dunes.length;i++){
      var d = dunes[i];
      var sp = screenPos(d.x, WATER_LEVEL);
      if(sp.x < -200 || sp.x > W+200) continue;
      ctx.fillStyle = 'rgba(190,140,120,0.35)';
      ctx.beginPath();
      ctx.moveTo(sp.x-90, sp.y);
      ctx.lineTo(sp.x, sp.y - d.h);
      ctx.lineTo(sp.x+90, sp.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawWater(){
    var sp = screenPos(0, WATER_LEVEL);
    var g = ctx.createLinearGradient(0, WATER_LEVEL, 0, H);
    g.addColorStop(0, '#2f6f8f');
    g.addColorStop(1, '#17415c');
    ctx.fillStyle = g;
    ctx.fillRect(0, WATER_LEVEL, W, H - WATER_LEVEL);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    var waveOffset = (camera.x * 0.6) % 40;
    for(var y = WATER_LEVEL + 14; y < H; y += 22){
      ctx.beginPath();
      for(var x = -waveOffset; x < W+40; x += 40){
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x+10, y-8, x+20, y);
        ctx.quadraticCurveTo(x+30, y+8, x+40, y);
      }
      ctx.stroke();
    }
  }

  function drawRingAt(sx, sy, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    var rx = RING_RX + RIM_THICK/2;
    var ry = RING_R + RIM_THICK/2;

    ctx.save();
    ctx.globalAlpha = alpha * 0.35;
    ctx.shadowColor = '#ff7a4a';
    ctx.shadowBlur = 22;
    ctx.strokeStyle = '#ff6a3a';
    ctx.lineWidth = RIM_THICK + 6;
    ctx.beginPath();
    ctx.ellipse(sx, sy, rx, ry, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();

    var grad = ctx.createLinearGradient(sx, sy-ry, sx, sy+ry);
    grad.addColorStop(0, '#ffb07a');
    grad.addColorStop(0.5, '#ff7a4a');
    grad.addColorStop(1, '#e8502a');
    ctx.strokeStyle = grad;
    ctx.lineWidth = RIM_THICK;
    ctx.beginPath();
    ctx.ellipse(sx, sy, rx, ry, 0, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(sx, sy, RING_RX + 2, RING_R + 2, 0, -Math.PI*0.85, -Math.PI*0.15);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(70,20,0,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(sx, sy, RING_RX, RING_R, 0, 0, Math.PI*2);
    ctx.stroke();

    // open-ring cue: a soft inner shadow so the hoop reads as a flattened
    // ring you fly through, not a flat disc
    ctx.strokeStyle = 'rgba(70,20,0,0.18)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(sx, sy, RING_RX - RIM_THICK*0.6, RING_R - RIM_THICK*0.6, 0, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function drawRings(){
    if(prevRingGhost && prevRingGhost.alpha > 0){
      var psp = screenPos(prevRingGhost.x, prevRingGhost.y);
      drawRingAt(psp.x, psp.y, prevRingGhost.alpha);
      prevRingGhost.alpha -= 0.07;
      if(prevRingGhost.alpha <= 0) prevRingGhost = null;
    }
    var sp = screenPos(ring.x, ring.y);
    if(sp.x > -140 && sp.x < W+140){
      drawRingAt(sp.x, sp.y, 1);
    }
  }

  function drawBall(){
    var sp = screenPos(ball.x, ball.y);
    ctx.save();

    // soft contact shadow on the ground plane below the ball, so it reads
    // as a solid round object rather than a flat sticker
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#20140a';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y + ball.r*0.55, ball.r*0.9, ball.r*0.32, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.translate(sp.x, sp.y);
    ctx.rotate(ball.rot);
    var r = ball.r;

    // dark outline first so the ball has a crisp silhouette against the sky
    ctx.fillStyle = '#7a3406';
    ctx.beginPath();
    ctx.arc(0,0,r+1.5,0,Math.PI*2);
    ctx.fill();

    var g = ctx.createRadialGradient(-r*0.35,-r*0.35,r*0.2,0,0,r);
    g.addColorStop(0, '#ffc47a');
    g.addColorStop(0.55, '#ff9a3c');
    g.addColorStop(1, '#d9600f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // curved basketball seams -- these rotate with the ball so the spin
    // (not just the position) is clearly visible every frame
    ctx.strokeStyle = 'rgba(122,52,6,0.9)';
    ctx.lineWidth = Math.max(1.5, r*0.1);
    ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.quadraticCurveTo(r*0.55,0,0,r);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.quadraticCurveTo(-r*0.55,0,0,r);
    ctx.stroke();

    // small specular highlight for a round, glossy read
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-r*0.32,-r*0.34,r*0.26,r*0.16,-0.5,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function render(){
    drawSky();
    drawClouds();
    drawDunes();
    drawRings();
    drawWater();
    drawBall();
  }

  var lastTime = null;
  function loop(ts){
    if(gameState !== 'playing' && gameState !== 'splashing'){ render(); return; }
    if(lastTime == null) lastTime = ts;
    var dt = Math.min((ts-lastTime)/1000, 1/30);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function onTap(){
    if(gameState === 'playing') flap();
  }

  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); onTap(); });

  startBtn.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    e.preventDefault();
    startGame();
  });

  resetWorld();
  render();

  // debug hook for automated testing
  window.__dbg = function(){
    return {
      gameState: gameState,
      ball: { x: ball.x, y: ball.y, vy: ball.vy },
      ring: { x: ring.x, y: ring.y, resolved: ring.resolved },
      camX: camera.x, score: score, multiplier: multiplier, best: best
    };
  };
  window.__debugFlap = function(){ flap(); };
  window.__debugStart = function(){ startGame(); };
  window.__debugSetRing = function(x,y){ ring.x = x; ring.y = y; ring.resolved = false; };
})();
</script>
</body>
</html>
